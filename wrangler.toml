# Deployed by Cloudflare Workers Builds (connected to this GitHub repo).
# The name must match the Worker name in the Cloudflare dashboard.
name = "my-vpn"
main = "backend/src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
REPO = "iliyamosa/my-vpn"
BRANCH = "main"
# Admin username (not secret).
ADMIN_USER = "iliyamosa"
# Google Sign-In Web client id (public, not a secret). Enables the "ورود با گوگل" button.
GOOGLE_CLIENT_ID = "23966033115-msc4pr8koj18iusrapa9ei74vc9ubkmr.apps.googleusercontent.com"
# The admin PASSWORD is never stored — only its irreversible PBKDF2 hash (120k iterations).
# Recovering the password from this hash is infeasible. To rotate it, generate a new hash
# and replace the line below, or move it to a Cloudflare secret of the same name and delete it here.
ADMIN_PASS_HASH = "pbkdf2$100000$/Qvpfiol+CaK9/VCxb39GQ==$SS/22BRm4KRI/d6/Fstk+zcDpEVkmPfdGEXNnfUtd+8="

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]
