# Deployed by Cloudflare Workers Builds (connected to this GitHub repo).
# The name must match the Worker name in the Cloudflare dashboard.
name = "my-vpn"
main = "backend/src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
REPO = "iliyamosa/my-vpn"
BRANCH = "main"
# Admin username (not secret). The admin PASSWORD is never stored here — only its
# PBKDF2 hash, set as a Cloudflare secret named ADMIN_PASS_HASH (Settings -> Variables and Secrets).
ADMIN_USER = "iliyamosa"

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]
