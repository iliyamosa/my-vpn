name: Deploy backend

# Deploys the Cloudflare Worker (backend/src + wrangler.toml) whenever the backend changes
# on main, and on manual run. Auth via repo secrets: either CLOUDFLARE_API_TOKEN, or the
# Global API Key pair CLOUDFLARE_API_KEY + CLOUDFLARE_EMAIL. CLOUDFLARE_ACCOUNT_ID optional.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy with wrangler
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Backend deploy failed (run ${{ github.run_number }})."
            echo
            echo '### Relevant lines'
            echo '```'
            grep -iE "error|account|auth|code:|more than one|not found|unauthor|forbidden|missing|invalid|required|binding|durable|migration|✘|✓ |Uploaded|Deployed" deploy.log 2>/dev/null | head -50 || echo "(no deploy.log)"
            echo '```'
          } > dreport.md
          gh issue create --title "Backend deploy failed #${{ github.run_number }}" --body-file dreport.md || true
