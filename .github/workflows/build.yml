name: Build APK

on:
  # Pushes to main publish the public APK to the "latest" release (the live download link).
  # Pushes to v2 only build and upload a workflow artifact, so new work can be tested
  # without disturbing users who are downloading from "latest".
  push:
    branches: [main, v2]
    paths-ignore:
      - 'remote/ads/**'
      - 'backend/**'
      - 'wrangler.toml'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: build
  cancel-in-progress: true

env:
  XRAY_LIB_VERSION: v26.10.17

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Download Xray core library
        run: |
          mkdir -p app/libs
          curl -fsSL --retry 3 -o app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${XRAY_LIB_VERSION}/libv2ray.aar"
          ls -la app/libs

      # The keystore in signing/ is encrypted (PKCS12, AES-256); only its password is secret.
      - name: Prepare signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ] && [ -f signing/release.p12 ]; then
            if keytool -list -keystore signing/release.p12 -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
              echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/signing/release.p12" >> "$GITHUB_ENV"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
              echo "KEY_ALIAS=app" >> "$GITHUB_ENV"
              echo "KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
              echo "Signing with the release key."
            else
              echo "::warning::KEYSTORE_PASSWORD secret is wrong; building with a temporary key."
            fi
          else
            echo "::warning::KEYSTORE_PASSWORD secret is missing; building with a temporary key."
          fi

      - name: Build
        run: |
          set -o pipefail
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod +x gradlew
          # APKs for direct install + an AAB (App Bundle) for Google Play.
          ./gradlew --no-daemon --stacktrace assembleClientRelease bundleClientRelease 2>&1 | tee build.log

      - name: Collect APKs
        id: collect
        run: |
          mkdir -p out
          # The download files carry the app's own name (from app.properties), not "app-*".
          NAME=$(grep -E '^APP_NAME=' app.properties | cut -d= -f2- | tr -d '\r' | sed 's/[[:space:]]//g')
          NAME=${NAME:-FAIROSVPN}
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          for f in app/build/outputs/apk/client/release/*.apk; do
            case "$f" in
              *arm64-v8a*) cp "$f" "out/${NAME}-arm64.apk" ;;
              *armeabi-v7a*) cp "$f" "out/${NAME}-arm32.apk" ;;
              *universal*) cp "$f" "out/${NAME}.apk" ;;
            esac
          done
          # The Play upload bundle.
          for f in app/build/outputs/bundle/clientRelease/*.aab; do
            [ -f "$f" ] && cp "$f" "out/${NAME}-play.aab"
          done
          ls -la out
          VERSION_NAME=$(grep -E '^VERSION_NAME=' app.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.name }}-${{ steps.collect.outputs.version }}-b${{ github.run_number }}
          path: |
            out/*.apk
            out/*.aab
          if-no-files-found: error

      - name: Publish release
        # Only main updates the live "latest" download link. v2 builds stay as artifacts above.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.collect.outputs.name }}
        run: |
          TAG="v${{ steps.collect.outputs.version }}-b${{ github.run_number }}"
          gh release create "$TAG" "out/${NAME}.apk" "out/${NAME}-arm64.apk" "out/${NAME}-arm32.apk" "out/${NAME}-play.aab" \
            --title "$TAG" \
            --notes "${NAME}.apk: نصب روی همهٔ گوشی‌ها (پیشنهادی). ${NAME}-arm64.apk: گوشی‌های جدید. ${NAME}-arm32.apk: گوشی‌های قدیمی. ${NAME}-play.aab: برای انتشار در Google Play." \
            --latest
          # keep only the 5 newest public app releases
          gh release list --limit 100 --exclude-drafts --json tagName,createdAt \
            --jq 'map(select(.tagName | startswith("v"))) | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
            | while read t; do gh release delete "$t" --yes --cleanup-tag || true; done
          # close old build-failure reports
          gh issue list --state open --search "Build failed in:title" --json number --jq '.[].number' \
            | while read n; do gh issue close "$n" --comment "Fixed in build ${{ github.run_number }}." || true; done

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build ${{ github.run_number }} failed (commit ${{ github.sha }})."
            echo
            echo '### Errors'
            echo '```'
            grep -E "^e: |error:|ERROR|What went wrong|FAILURE|Could not|Unresolved|> " build.log 2>/dev/null | grep -v "^> Task" | head -120 || true
            echo '```'
            echo
            echo '### Last lines'
            echo '```'
            tail -n 120 build.log 2>/dev/null || echo "(no build.log)"
            echo '```'
          } > report.md
          gh issue create --title "Build failed #${{ github.run_number }}" --body-file report.md || true
