name: Deploy tunnel

# Deploys the VLESS-over-WebSocket proxy Worker (tunnel/) to a SEPARATE Cloudflare account,
# so a possible ToS action never touches the backend account. Manual only.
# Needs a repo secret CLOUDFLARE_TUNNEL_API_TOKEN (from the separate account),
# optionally CLOUDFLARE_TUNNEL_ACCOUNT_ID.

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-tunnel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy tunnel worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy --config tunnel/wrangler.toml 2>&1 | tee deploy.log

      - name: Report deployed URL
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(grep -oiE "https://[a-z0-9.-]+\.workers\.dev" deploy.log | head -1)
          {
            echo "Tunnel deployed (run ${{ github.run_number }})."
            echo
            echo "URL: ${URL:-unknown}"
            echo
            echo '```'
            grep -iE "version id|uploaded|total upload|deployed|current version|worker startup|no changes|triggers" deploy.log 2>/dev/null | head -20 || true
            echo '```'
          } > turl.md
          gh issue create --title "Tunnel deployed #${{ github.run_number }}" --body-file turl.md || true

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Tunnel deploy failed (run ${{ github.run_number }})."
            echo '```'
            grep -iE "error|account|auth|code:|not found|unauthor|forbidden|socket|compat|more than one|workers.dev|✘" deploy.log 2>/dev/null | head -50 || echo "(no deploy.log)"
            echo '```'
          } > treport.md
          gh issue create --title "Tunnel deploy failed #${{ github.run_number }}" --body-file treport.md || true
